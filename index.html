<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whit — halt fest, wie's dir geht.</title>
<style>
  :root {
    --bg: #EEDCD4; --fg: #231814; --muted: #6B5A52; --rule: rgba(35,24,20,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F0C14; --fg: #F3E9E1; --muted: #9A8E92; --rule: rgba(243,233,225,.16); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 48px 20px; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 30rem; text-align: center; }
  h1 { font-size: 3.2rem; letter-spacing: -.05em; margin: 0 0 .1em; font-weight: 600; }
  .tagline { color: var(--muted); font-size: 1.05rem; margin: 0 0 3em; }
  nav { display: flex; flex-direction: column; gap: .75rem; }
  a { display: block; padding: 14px 20px; border: 1px solid var(--rule);
      border-radius: 999px; color: inherit; text-decoration: none; font-weight: 500; }
  a:hover { border-color: var(--fg); }
  footer { margin-top: 3em; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>whit</h1>
  <p class="tagline">halt fest, wie's dir geht.</p>
  <nav>
    <a href="privacy-de.html">Datenschutzerklärung</a>
